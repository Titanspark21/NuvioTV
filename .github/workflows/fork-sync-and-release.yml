name: Sync upstream and release

# Keeps this fork level with NuvioMedia/NuvioTV and publishes a signed APK set
# whenever upstream moves. The app's in-app updater points at THIS repo's
# releases (see GITHUB_OWNER in app/build.gradle.kts), so a successful run here
# is what makes the "update available" prompt appear on the TV.
#
# The fork's own changes live as ordinary commits on top of upstream/dev and are
# rebased onto each new upstream state. A rebase that conflicts stops the run and
# opens an issue instead of publishing anything.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build and release even if upstream has not moved
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync-and-release
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: [self-hosted, Linux, X64, ajay-trusted]
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: https://github.com/NuvioMedia/NuvioTV.git

    steps:
      - name: Check out this fork
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git config user.name "fork-sync"
          git config user.email "fork-sync@users.noreply.github.com"
          git remote add upstream "${UPSTREAM}" 2>/dev/null || git remote set-url upstream "${UPSTREAM}"
          git fetch upstream dev

      - name: Decide whether there is anything to do
        id: decide
        run: |
          upstream_sha="$(git rev-parse upstream/dev)"
          echo "upstream_sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"

          # Each release records the upstream commit it was built from, so a scheduled
          # run that finds the same commit can stop without building anything.
          last_sha="$(gh release view --repo "${GITHUB_REPOSITORY}" --json body --jq .body 2>/dev/null \
            | grep -oE 'upstream-sha: [0-9a-f]{40}' | head -1 | cut -d' ' -f2 || true)"

          if [[ "${last_sha}" == "${upstream_sha}" && "${{ inputs.force }}" != "true" ]]; then
            echo "Upstream unchanged since the last release (${upstream_sha}); nothing to do."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Rebase the fork's changes onto upstream
        if: steps.decide.outputs.proceed == 'true'
        id: rebase
        run: |
          if git rebase upstream/dev; then
            echo "Rebase clean."
          else
            git rebase --abort || true
            echo "conflict=true" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

      - name: Report a rebase conflict
        if: failure() && steps.rebase.outputs.conflict == 'true'
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Upstream sync needs a hand ($(date -u +%Y-%m-%d))" \
            --body "The scheduled sync could not rebase this fork's changes onto upstream/dev at ${{ steps.decide.outputs.upstream_sha }} without conflicts. Upstream has edited the same lines the fork changes. Resolve it locally with \`git fetch upstream && git rebase upstream/dev\`, push, then re-run this workflow. No release was published, so the app keeps offering the last good build."

      # Upstream has said it wants the built-in debrid integration gone. This fork keeps
      # it, and the sync above rebases blindly, so check the feature survived before
      # spending an hour building a release that quietly lost it. See
      # preservation/TORBOX-INSTANT.md.
      - name: Check Torbox Instant survived the rebase
        if: steps.decide.outputs.proceed == 'true'
        id: torbox_guard
        run: bash scripts/check-torbox-instant.sh

      # A guard failure means upstream has finally removed the feature. Stop here - the
      # push and the release both come later, so nothing ships and the device keeps the
      # last good build - and say so somewhere Ajay will actually see it. Without this the
      # run just goes red in a tab nobody opens.
      - name: Report that Torbox Instant is missing
        if: failure() && steps.torbox_guard.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The schedule retries every 6 hours; without this check that is four new issues
          # a day saying the same thing.
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --label torbox-instant --limit 1 --json number --jq '.[].number' || true)"

          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --body "Still missing as of upstream \`${{ steps.decide.outputs.upstream_sha }}\` ($(date -u +%Y-%m-%d\ %H:%M) UTC). No release published."
            exit 0
          fi

          gh label create torbox-instant --repo "${GITHUB_REPOSITORY}" \
            --color B60205 --description "Fork-preserved feature is missing from upstream" 2>/dev/null || true

          {
            echo "The upstream sync rebased cleanly, but the Torbox Instant guard failed"
            echo "afterwards. That means upstream has removed or gutted part of the built-in"
            echo "debrid integration this fork deliberately keeps."
            echo
            echo "**Nothing was published.** The rebased branch was not pushed and no release"
            echo "was created, so the TV keeps offering the last good build. This will keep"
            echo "happening every 6 hours until it is resolved."
            echo
            echo "What to do:"
            echo
            echo "1. \`git fetch upstream && git rebase upstream/dev\`"
            echo "2. \`bash scripts/check-torbox-instant.sh\` to see exactly what went."
            echo "3. Restore it: \`git checkout torbox-instant-v1 -- <the paths named in the failure>\`"
            echo "4. Fix any call sites upstream changed around it, commit, push."
            echo
            echo "Every file the feature is built from is listed in \`preservation/TORBOX-INSTANT.md\`."
            echo
            echo "Failing run: ${RUN_URL}"
          } > torbox-issue.md

          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Torbox Instant is missing from upstream - sync halted" \
            --label torbox-instant \
            --body-file torbox-issue.md

      - name: Read version and pick a build number
        if: steps.decide.outputs.proceed == 'true'
        id: version
        run: |
          base_version="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          if [[ -z "${base_version}" ]]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi

          # Releases for the same upstream version get an incrementing suffix, so a
          # rebuild always compares newer than whatever is already on the device.
          existing="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -c "^v${base_version}\." || true)"
          fork_build=$(( existing + 1 ))

          echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "fork_build=${fork_build}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${base_version}.${fork_build}" >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        if: steps.decide.outputs.proceed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.decide.outputs.proceed == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Write build configuration
        if: steps.decide.outputs.proceed == 'true'
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          for name in LOCAL_PROPERTIES_BASE64 RELEASE_KEYSTORE_BASE64 RELEASE_KEY_ALIAS \
                      RELEASE_KEY_PASSWORD RELEASE_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository secret: ${name}" >&2
              exit 1
            fi
          done

          keystore_path="${RUNNER_TEMP}/fork-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

          # sdk.dir is machine-specific; the runner supplies its own.
          sed -i -E '/^[[:space:]]*sdk\.dir[[:space:]]*=/d' local.properties
          {
            # A leading newline: the stored secret may not end in one, and without this
            # the first line below would be glued onto the last existing property.
            echo
            echo "NUVIO_RELEASE_STORE_FILE=${keystore_path}"
            echo "NUVIO_RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"

            # Dolby Vision Profile 7 -> 8.1 conversion, matching what upstream ships.
            # Profile 7 is the dual-layer flavour found in UHD Blu-ray remuxes, which no
            # Android device decodes directly; libdovi rewrites the metadata into 8.1 so
            # the hardware can play it with dynamic DV intact instead of dropping to
            # HDR10. Not secret, so it lives here rather than in the stored properties.
            echo "DOVI_NATIVE_ENABLED=true"
            echo "DOVI_EXTRACTOR_HOOK_READY=true"
            echo "DOVI_ENABLE_REAL_LINK=true"
            echo "DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi"
          } >> local.properties

      - name: Accept SDK licences
        if: steps.decide.outputs.proceed == 'true'
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # The release build has run out of memory here before, and the heap numbers in
      # gradle.properties were chosen without knowing what this machine actually has.
      # Two lines of output means the next failure can be diagnosed from the log alone.
      - name: Report what this machine has to work with
        if: steps.decide.outputs.proceed == 'true'
        run: |
          echo "cores: $(nproc)"
          free -h || true
          df -h . | tail -1

      - name: Build release APKs
        if: steps.decide.outputs.proceed == 'true'
        run: heavy-build-slot ./gradlew :app:assembleFullRelease -PFORK_BUILD=${{ steps.version.outputs.fork_build }} --stacktrace

      # Keep the APKs even if publishing fails. This build is the better part of an
      # hour, and losing it to a bad token or a rate limit at the last step is a waste
      # that is entirely avoidable.
      - name: Keep the APKs regardless
        if: steps.decide.outputs.proceed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: nuviotv-fork-${{ steps.version.outputs.tag }}-apks
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Push the rebased branch
        if: steps.decide.outputs.proceed == 'true'
        run: git push --force-with-lease origin dev

      - name: Publish the release
        if: steps.decide.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.decide.outputs.upstream_sha }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/full/release -maxdepth 1 -name '*.apk' | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "No APKs were produced." >&2
            exit 1
          fi

          upstream_subject="$(git log -1 --format=%s "${UPSTREAM_SHA}")"

          {
            echo "Automatic build of NuvioTV ${BASE_VERSION} with the fork's shuffle button."
            echo
            echo "Upstream: NuvioMedia/NuvioTV at [\`${UPSTREAM_SHA:0:7}\`](https://github.com/NuvioMedia/NuvioTV/commit/${UPSTREAM_SHA}) - ${upstream_subject}"
            echo
            echo "Notes for the upstream changes are on [their releases page](https://github.com/NuvioMedia/NuvioTV/releases)."
            echo
            echo "<!-- upstream-sha: ${UPSTREAM_SHA} -->"
          } > notes.md

          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --target "$(git rev-parse HEAD)" \
            --title "${TAG}" \
            --notes-file notes.md \
            "${apks[@]}"

      # Anything else that went wrong - a broken build, a bad secret, a failed publish.
      # The two failures above explain themselves and are handled where they happen; this
      # exists so that no other failure is silent, because an unattended job that only
      # reports into the Actions tab is an unattended job nobody hears fail.
      - name: Report any other failure
        if: failure() && steps.rebase.outputs.conflict != 'true' && steps.torbox_guard.outcome != 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --label sync-failure --limit 1 --json number --jq '.[].number' || true)"

          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --body "Failed again $(date -u +%Y-%m-%d\ %H:%M) UTC on upstream \`${{ steps.decide.outputs.upstream_sha }}\`. [Log](${RUN_URL})"
            exit 0
          fi

          gh label create sync-failure --repo "${GITHUB_REPOSITORY}" \
            --color D93F0B --description "Automatic upstream sync failed" 2>/dev/null || true

          {
            echo "The 6-hourly sync failed at a step other than the rebase or the Torbox"
            echo "Instant guard, so this is most likely a build or publishing problem rather"
            echo "than an upstream change to work around."
            echo
            echo "No release was published; the TV keeps offering the last good build. It will"
            echo "retry in 6 hours and comment here rather than opening another issue."
            echo
            echo "The failing step and its output are in the [run log](${RUN_URL})."
            echo "Paste the error into Claude Code in the project to get it fixed."
          } > sync-issue.md

          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Upstream sync failed - no release published ($(date -u +%Y-%m-%d))" \
            --label sync-failure \
            --body-file sync-issue.md
