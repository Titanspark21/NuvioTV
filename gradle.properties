# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Fork: memory for the release build on the self-hosted runner.
#
# The release build runs three separate JVMs, and each has its own heap that inherits
# nothing from the others: the Gradle daemon, the Kotlin compile daemon, and the R8
# worker that AGP launches through the worker API. Every OutOfMemoryError so far has
# been in one of the latter two, which is why raising only the first line changed
# nothing.
#
# The runner is 16 cores / 19GB with 8GB swap, so there is no reason to be frugal.
# These run largely in sequence - compile finishes before minification starts - so the
# peak is roughly one of them at a time, not the sum.
# The daemon also runs APK packaging, which turned out to be the hungriest step of
# the lot: this build produces four ABI splits plus a universal APK, and the splitter
# ran out of heap at 6144m. Unlike R8, packaging runs inside the daemon, so this is
# the number that governs it.
org.gradle.jvmargs=-Xmx10240m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Kotlin compilation. Ran out of heap inside the ASM bytecode analyser at 2048m;
# 6144m completed it.
kotlin.daemon.jvmargs=-Xmx6144m

# The R8 minification worker. 6144m completed it.
android.r8.jvmargs=-Xmx6144m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true